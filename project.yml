name: CastLite
options:
  bundleIdPrefix: com.castlite
  deploymentTarget:
    iOS: "16.0"
settings:
  SWIFT_VERSION: "5.10"
  ENABLE_BITCODE: false

targets:
  CastCore:
    type: framework
    platform: iOS
    sources:
      - path: Sources/CastCore
    info:
      path: Sources/CastCore/Info.plist
      properties:
        CFBundleDisplayName: "CastCore"
        CFBundleIdentifier: "com.castlite.CastCore"
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"

  CastLite:
    type: application
    platform: iOS
    bundleId: com.castlite.app
    scheme:
      testTargets:
        - CastLiteAppTests
    sources:
      - path: Sources/CastLiteApp
    dependencies:
      - target: CastCore
      - target: CastLiteBroadcastExtension
        embed: true
    info:
      path: Sources/CastLiteApp/Info.plist
      properties:
        CFBundleDisplayName: "Cast-Lite"
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: "Cast-Lite requires local network access to discover Smart TVs and stream media over Wi-Fi."
        NSPhotoLibraryUsageDescription: "Cast-Lite needs access to your photos and videos to stream them to your Smart TV."
        NSBonjourServices:
          - "_googlecast._tcp"

  CastLiteAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/CastLiteAppTests
    dependencies:
      - target: CastLite
      - target: CastCore
    settings:
      GENERATE_INFOPLIST_FILE: YES

  CastLiteBroadcastExtension:
    type: app-extension
    platform: iOS
    bundleId: com.castlite.app.broadcast
    scheme: {}
    sources:
      - path: Sources/CastLiteBroadcastExtension
    dependencies:
      - target: CastCore
    info:
      path: Sources/CastLiteBroadcastExtension/Info.plist
      properties:
        CFBundleDisplayName: "Cast-Lite Broadcast"
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: "com.apple.broadcast-services-upload"
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).SampleHandler"

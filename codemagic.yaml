workflows:
  ios-development:
    name: Build iOS Development IPA
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Generate Xcode Project
        script: |
          xcodegen generate
      - name: Build & Package Development IPA
        script: |
          set -e
          xcodebuild build \
            -project CastLite.xcodeproj \
            -scheme CastLite \
            -configuration Debug \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SYMROOT=build

          APP_PATH=$(find build -name "CastLite.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: CastLite.app not found in build directory!"
            exit 1
          fi
          echo "Found app at: $APP_PATH"

          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r CastLite-Dev.ipa Payload
          rm -rf Payload
          ls -lh CastLite-Dev.ipa
    artifacts:
      - CastLite-Dev.ipa

  ios-production:
    name: Build iOS Production IPA
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Generate Xcode Project
        script: |
          xcodegen generate
      - name: Build & Package Production IPA
        script: |
          set -e
          xcodebuild build \
            -project CastLite.xcodeproj \
            -scheme CastLite \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SYMROOT=build

          APP_PATH=$(find build -name "CastLite.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: CastLite.app not found in build directory!"
            exit 1
          fi
          echo "Found app at: $APP_PATH"

          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r CastLite-Release.ipa Payload
          rm -rf Payload
          ls -lh CastLite-Release.ipa
    artifacts:
      - CastLite-Release.ipa

name: Build iOS Production IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - integration/cast-lite-spec

jobs:
  build-prod:
    name: Build & Package Production IPA (Release)
    runs-on: macos-13
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Select Xcode Version
        run: |
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          elif [ -d "/Applications/Xcode_15.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.2.app
          fi
          xcodebuild -version

      - name: Build Release Archive (Unsigned)
        run: |
          xcodebuild archive \
            -project CastLite.xcodeproj \
            -scheme CastLite \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/CastLite.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Payload into IPA
        run: |
          mkdir -p Payload
          cp -r build/CastLite.xcarchive/Products/Applications/CastLite.app Payload/
          zip -r CastLite-Release.ipa Payload
          rm -rf Payload

      - name: Upload Production IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CastLite-Release-iOS
          path: CastLite-Release.ipa
